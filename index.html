<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>탁구 용품 대여 대장</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-12">

    <div class="max-w-4xl mx-auto px-4 py-6" id="app-container">

        <header class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-emerald-500 text-white rounded-2xl shadow-lg mb-3 text-3xl">🏓</div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-800 tracking-tight">탁구 용품 대여 대장</h1>
        </header>

        <!-- 신규 대여 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 sm:p-6 mb-6">
            <h2 class="text-base font-bold text-slate-700 mb-4 flex items-center gap-2">
                <span class="w-2 h-4 bg-emerald-500 rounded-full inline-block"></span>
                신규 대여 등록
            </h2>

            <form id="rental-form" onsubmit="handleFormSubmit(event)">
                <div class="grid grid-cols-2 gap-3 sm:gap-4 mb-4">
                    <div>
                        <label for="dong" class="block text-xs font-semibold text-slate-600 mb-1">동</label>
                        <input type="text" id="dong" placeholder="예: 101" inputmode="numeric" required
                            class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
                    </div>
                    <div>
                        <label for="ho" class="block text-xs font-semibold text-slate-600 mb-1">호수</label>
                        <input type="text" id="ho" placeholder="예: 502" inputmode="numeric" required
                            class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 sm:gap-4 mb-5">
                    <div>
                        <label for="racket" class="block text-xs font-semibold text-slate-600 mb-1">라켓 수량</label>
                        <select id="racket" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                            <option value="2개 (1세트)">2개 (1세트)</option>
                            <option value="4개 (2세트)">4개 (2세트)</option>
                            <option value="1개">1개</option>
                        </select>
                    </div>
                    <div>
                        <label for="ball" class="block text-xs font-semibold text-slate-600 mb-1">탁구공 수량</label>
                        <select id="ball" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
                            <option value="2개">2개</option>
                            <option value="1개">1개</option>
                            <option value="3개 이상">3개 이상</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold rounded-xl shadow-md text-sm sm:text-base">
                    대여 작성 완료
                </button>
            </form>
        </div>

        <!-- 현재 대여 현황 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 sm:p-6 mb-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-base font-bold text-slate-700 flex items-center gap-2">
                    <span class="w-2 h-4 bg-blue-500 rounded-full inline-block"></span>
                    현재 대여 현황
                </h2>
                <span id="active-count-badge" class="px-2.5 py-0.5 bg-blue-50 text-blue-600 text-xs font-bold rounded-full border border-blue-100">
                    0건 대여 중
                </span>
            </div>
            <div id="rental-list" class="space-y-3"></div>
        </div>

        <!-- 관리자 -->
        <div class="bg-slate-800 text-white rounded-2xl shadow-md p-5 sm:p-6 border border-slate-700">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-base font-bold text-slate-100">🔒 관리자 모드</h2>
                <button id="btn-logout" onclick="logoutAdmin()" class="hidden px-3 py-1 bg-rose-600/80 hover:bg-rose-600 text-white text-xs font-semibold rounded-lg">
                    로그아웃
                </button>
            </div>

            <div id="admin-auth-box" class="flex gap-2">
                <input type="password" id="admin-pw" placeholder="관리자 비밀번호"
                    class="flex-1 px-3 py-2 bg-slate-900/80 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-500/30">
                <button onclick="checkAdmin()" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-sm rounded-xl">
                    접속
                </button>
            </div>

            <div id="admin-panel" class="hidden mt-4 pt-4 border-t border-slate-700">

                <div class="grid grid-cols-3 gap-2 sm:gap-4 mb-4 text-center">
                    <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/60">
                        <div class="text-xs text-slate-400 font-medium mb-1">총 누적</div>
                        <div class="text-lg sm:text-xl font-black text-white" id="stat-total">0건</div>
                    </div>
                    <div class="bg-amber-500/10 p-3 rounded-xl border border-amber-500/20">
                        <div class="text-xs text-amber-400 font-medium mb-1">대여 중</div>
                        <div class="text-lg sm:text-xl font-black text-amber-400" id="stat-renting">0건</div>
                    </div>
                    <div class="bg-emerald-500/10 p-3 rounded-xl border border-emerald-500/20">
                        <div class="text-xs text-emerald-400 font-medium mb-1">반납 완료</div>
                        <div class="text-lg sm:text-xl font-black text-emerald-400" id="stat-returned">0건</div>
                    </div>
                </div>

                <div class="flex flex-col gap-3 mb-4">
                    <div class="flex bg-slate-900 p-1 rounded-xl gap-1 w-full">
                        <button onclick="setAdminFilter('all')" id="tab-all" class="flex-1 py-2 px-3 text-xs font-semibold rounded-lg text-amber-400 bg-slate-800">전체</button>
                        <button onclick="setAdminFilter('renting')" id="tab-renting" class="flex-1 py-2 px-3 text-xs font-semibold rounded-lg text-slate-400 hover:text-white">대여 중</button>
                        <button onclick="setAdminFilter('returned')" id="tab-returned" class="flex-1 py-2 px-3 text-xs font-semibold rounded-lg text-slate-400 hover:text-white">반납 완료</button>
                    </div>

                    <div class="flex gap-2">
                        <input type="text" id="admin-search" placeholder="동/호수 검색..." oninput="renderAdminTable()"
                            class="flex-1 min-w-[120px] px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-400 focus:outline-none">
                        <button onclick="downloadExcel()" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl whitespace-nowrap">
                            📊 CSV 엑셀
                        </button>
                    </div>
                </div>

                <!-- 모바일 카드 -->
                <div id="admin-card-list" class="block sm:hidden space-y-2.5"></div>

                <!-- PC 표 -->
                <div class="hidden sm:block overflow-x-auto rounded-xl border border-slate-700 bg-slate-900/90">
                    <table class="w-full text-left text-xs text-slate-300">
                        <thead class="bg-slate-800 text-slate-400 font-semibold border-b border-slate-700">
                            <tr>
                                <th class="p-3 text-center">호실</th>
                                <th class="p-3">대여 품목</th>
                                <th class="p-3">대여 시각</th>
                                <th class="p-3">반납 시각</th>
                                <th class="p-3 text-center">상태</th>
                                <th class="p-3 text-center">관리</th>
                            </tr>
                        </thead>
                        <tbody id="admin-table-body" class="divide-y divide-slate-800"></tbody>
                    </table>
                </div>

                <div class="mt-4 flex justify-between items-center text-xs text-slate-400">
                    <span>💡 5초마다 자동으로 갱신됩니다.</span>
                    <button onclick="confirmResetAll()" class="text-rose-400 hover:text-rose-300 underline">전체 데이터 초기화</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 확인 창 -->
    <div id="confirm-modal" class="hidden fixed inset-0 bg-slate-950/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl">
            <h3 class="text-lg font-bold text-slate-800 mb-2" id="confirm-modal-title">확인</h3>
            <p class="text-sm text-slate-600 mb-5 leading-relaxed" id="confirm-modal-message">이 작업을 진행하시겠습니까?</p>
            <div class="flex justify-end gap-2">
                <button id="confirm-modal-cancel" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl">취소</button>
                <button id="confirm-modal-ok" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-xl">확인</button>
            </div>
        </div>
    </div>

    <!-- 수정 창 -->
    <div id="edit-modal" class="hidden fixed inset-0 bg-slate-950/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
            <h3 class="text-base font-bold text-slate-800 mb-4">✏️ 대여 내역 수정</h3>
            <form id="edit-form" onsubmit="handleEditFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="edit-id">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">동</label>
                        <input type="text" id="edit-dong" required class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">호수</label>
                        <input type="text" id="edit-ho" required class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">라켓</label>
                        <select id="edit-racket" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm">
                            <option value="2개 (1세트)">2개 (1세트)</option>
                            <option value="4개 (2세트)">4개 (2세트)</option>
                            <option value="1개">1개</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">탁구공</label>
                        <select id="edit-ball" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm">
                            <option value="2개">2개</option>
                            <option value="1개">1개</option>
                            <option value="3개 이상">3개 이상</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">상태</label>
                    <select id="edit-status" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm">
                        <option value="renting">대여 중</option>
                        <option value="returned">반납 완료</option>
                    </select>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl">취소</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 알림 -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs sm:text-sm font-medium px-5 py-3 rounded-2xl shadow-xl transition-all duration-300 opacity-0 pointer-events-none translate-y-4 z-50">
        <span id="toast-message">알림 메시지</span>
    </div>

    <script>
        // ===== 서버 주소 (Netlify Functions) =====
        const API = '/api/rentals';

        let rentals = [];
        let isAdminLoggedIn = false;
        let adminPw = '';
        let currentFilter = 'all';

        function two(n) { return String(n).padStart(2, '0'); }
        function nowHM() { const d = new Date(); return `${two(d.getHours())}:${two(d.getMinutes())}`; }
        function adminHeaders() { return { 'x-admin-pw': adminPw }; }

        // 서버에서 목록 불러오기
        async function loadRentals() {
            try {
                const res = await fetch(API, { cache: 'no-store' });
                if (!res.ok) throw new Error('불러오기 실패');
                rentals = await res.json();
                renderAll();
            } catch (e) {
                console.error(e);
            }
        }

        window.onload = function () {
            loadRentals();
            setInterval(loadRentals, 5000); // 5초마다 자동 갱신
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) loadRentals();
            });
        };

        // 대여 등록
        async function handleFormSubmit(event) {
            event.preventDefault();
            const dong = document.getElementById('dong').value.trim();
            const ho = document.getElementById('ho').value.trim();
            if (!dong || !ho) return showToast('동과 호수를 입력해 주세요.');

            const d = new Date();
            const borrowTime = `${d.getMonth() + 1}/${d.getDate()} ${two(d.getHours())}:${two(d.getMinutes())}`;
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;

            try {
                const res = await fetch(API, {
                    method: 'POST',
                    body: JSON.stringify({
                        dong, ho, borrowTime,
                        racket: document.getElementById('racket').value,
                        ball: document.getElementById('ball').value
                    })
                });
                if (!res.ok) throw new Error();
                document.getElementById('dong').value = '';
                document.getElementById('ho').value = '';
                await loadRentals();
                showToast(`✅ ${dong}동 ${ho}호 대여가 등록되었습니다.`);
            } catch (e) {
                showToast('⚠️ 등록 실패. 인터넷 연결을 확인하세요.');
            } finally {
                btn.disabled = false;
            }
        }

        // 반납
        async function returnRental(id) {
            const item = rentals.find(r => r.id === id);
            if (!item) return;
            try {
                const res = await fetch(API, {
                    method: 'PATCH',
                    body: JSON.stringify({ id, action: 'return', returnTime: nowHM() })
                });
                if (!res.ok) throw new Error();
                await loadRentals();
                showToast(`🏓 ${item.dong}동 ${item.ho}호 반납 처리 완료`);
            } catch (e) {
                showToast('⚠️ 반납 처리 실패');
            }
        }

        // 수정창
        function openEditModal(id) {
            const item = rentals.find(r => r.id === id);
            if (!item) return;
            document.getElementById('edit-id').value = item.id;
            document.getElementById('edit-dong').value = item.dong;
            document.getElementById('edit-ho').value = item.ho;
            document.getElementById('edit-racket').value = item.racket;
            document.getElementById('edit-ball').value = item.ball;
            document.getElementById('edit-status').value = item.isReturned ? 'returned' : 'renting';
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        async function handleEditFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const item = rentals.find(r => r.id === id);
            if (!item) return;

            const isReturned = document.getElementById('edit-status').value === 'returned';
            let returnTime = item.returnTime;
            if (isReturned && !item.isReturned) returnTime = nowHM();
            else if (!isReturned) returnTime = null;

            try {
                const res = await fetch(API, {
                    method: 'PATCH',
                    headers: adminHeaders(),
                    body: JSON.stringify({
                        id,
                        fields: {
                            dong: document.getElementById('edit-dong').value.trim(),
                            ho: document.getElementById('edit-ho').value.trim(),
                            racket: document.getElementById('edit-racket').value,
                            ball: document.getElementById('edit-ball').value,
                            isReturned, returnTime
                        }
                    })
                });
                if (!res.ok) throw new Error();
                closeEditModal();
                await loadRentals();
                showToast('✏️ 수정되었습니다.');
            } catch (err) {
                showToast('⚠️ 수정 실패 (관리자 로그인을 확인하세요)');
            }
        }

        // 삭제
        function deleteRental(id) {
            const item = rentals.find(r => r.id === id);
            if (!item) return;
            showCustomConfirm('대여 내역 삭제', `${item.dong}동 ${item.ho}호 내역을 삭제하시겠습니까?`, async () => {
                try {
                    const res = await fetch(`${API}?id=${encodeURIComponent(id)}`, { method: 'DELETE', headers: adminHeaders() });
                    if (!res.ok) throw new Error();
                    await loadRentals();
                    showToast('🗑️ 삭제되었습니다.');
                } catch (e) {
                    showToast('⚠️ 삭제 실패');
                }
            });
        }

        // 전체 초기화
        function confirmResetAll() {
            showCustomConfirm('⚠️ 전체 초기화 경고', '모든 대여 내역을 삭제하시겠습니까? 복구할 수 없습니다.', async () => {
                try {
                    const res = await fetch(`${API}?all=1`, { method: 'DELETE', headers: adminHeaders() });
                    if (!res.ok) throw new Error();
                    await loadRentals();
                    showToast('🧹 전체 데이터가 초기화되었습니다.');
                } catch (e) {
                    showToast('⚠️ 초기화 실패');
                }
            });
        }

        // 관리자 로그인 (서버가 비밀번호 확인)
        async function checkAdmin() {
            const pw = document.getElementById('admin-pw').value.trim();
            try {
                const res = await fetch(API + '?verify=1', { headers: { 'x-admin-pw': pw } });
                if (!res.ok) throw new Error();
                adminPw = pw;
                isAdminLoggedIn = true;
                document.getElementById('admin-auth-box').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                document.getElementById('btn-logout').classList.remove('hidden');
                renderAdminTable();
                showToast('🔓 관리자 모드로 접속되었습니다.');
            } catch (e) {
                showToast('❌ 비밀번호가 올바르지 않습니다.');
                document.getElementById('admin-pw').value = '';
            }
        }

        function logoutAdmin() {
            isAdminLoggedIn = false;
            adminPw = '';
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('admin-auth-box').classList.remove('hidden');
            document.getElementById('btn-logout').classList.add('hidden');
            document.getElementById('admin-pw').value = '';
            showToast('🔒 로그아웃되었습니다.');
        }

        function setAdminFilter(filterType) {
            currentFilter = filterType;
            ['all', 'renting', 'returned'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                btn.className = t === filterType
                    ? 'flex-1 py-2 px-3 text-xs font-semibold rounded-lg text-amber-400 bg-slate-800'
                    : 'flex-1 py-2 px-3 text-xs font-semibold rounded-lg text-slate-400 hover:text-white';
            });
            renderAdminTable();
        }

        // ===== 화면 그리기 =====
        function renderAll() {
            renderUserList();
            if (isAdminLoggedIn) renderAdminTable();
        }

        function renderUserList() {
            const container = document.getElementById('rental-list');
            const activeRentals = rentals.filter(r => !r.isReturned);
            document.getElementById('active-count-badge').textContent = `${activeRentals.length}건 대여 중`;

            if (rentals.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">등록된 대여 내역이 없습니다.</div>`;
                return;
            }

            container.innerHTML = rentals.map(item => `
                <div class="flex items-center justify-between p-3.5 rounded-xl border ${
                    item.isReturned ? 'bg-slate-50 border-slate-200 text-slate-400' : 'bg-white border-slate-200 shadow-sm text-slate-800'
                }">
                    <div>
                        <div class="font-bold text-base flex items-center gap-2">
                            <span>${item.dong}동 ${item.ho}호</span>
                            ${item.isReturned ? '<span class="text-xs font-semibold px-2 py-0.5 bg-slate-200 text-slate-600 rounded">반납완료</span>' : ''}
                        </div>
                        <div class="text-xs text-slate-500 mt-0.5">라켓: ${item.racket} / 공: ${item.ball}</div>
                        <div class="text-[11px] text-slate-400 mt-1">대여: ${item.borrowTime} ${item.returnTime ? `| 반납: ${item.returnTime}` : ''}</div>
                    </div>
                    <div>
                        ${!item.isReturned
                            ? `<button onclick="returnRental('${item.id}')" class="px-3.5 py-2 bg-rose-500 hover:bg-rose-600 text-white font-bold text-xs rounded-xl shadow-sm">반납하기</button>`
                            : `<span class="text-xs text-slate-400 font-medium px-2 py-1">완료</span>`}
                    </div>
                </div>
            `).join('');
        }

        function renderAdminTable() {
            if (!isAdminLoggedIn) return;

            const tbody = document.getElementById('admin-table-body');
            const cardList = document.getElementById('admin-card-list');
            const keyword = document.getElementById('admin-search').value.trim();

            const total = rentals.length;
            const returned = rentals.filter(r => r.isReturned).length;
            document.getElementById('stat-total').textContent = `${total}건`;
            document.getElementById('stat-renting').textContent = `${total - returned}건`;
            document.getElementById('stat-returned').textContent = `${returned}건`;

            let filtered = rentals.filter(r => {
                if (currentFilter === 'renting') return !r.isReturned;
                if (currentFilter === 'returned') return r.isReturned;
                return true;
            });
            if (keyword) filtered = filtered.filter(r => r.dong.includes(keyword) || r.ho.includes(keyword));

            const badge = (item) => `<span class="px-2 py-0.5 text-[11px] font-bold rounded-full ${
                item.isReturned
                    ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'
                    : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'
            }">${item.isReturned ? '반납완료' : '대여중'}</span>`;

            if (filtered.length === 0) {
                cardList.innerHTML = `<div class="p-6 text-center text-slate-500 text-xs">일치하는 대여 내역이 없습니다.</div>`;
                tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-500">일치하는 대여 내역이 없습니다.</td></tr>`;
                return;
            }

            cardList.innerHTML = filtered.map(item => `
                <div class="bg-slate-900/90 border border-slate-700/80 rounded-xl p-3.5 space-y-2 text-xs">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-white text-sm">${item.dong}동 ${item.ho}호</span>
                        ${badge(item)}
                    </div>
                    <div class="text-slate-300"><span class="text-slate-400">품목:</span> 라켓 ${item.racket} / 공 ${item.ball}</div>
                    <div class="flex justify-between text-[11px] text-slate-400 pt-1.5 border-t border-slate-800">
                        <div>대여: ${item.borrowTime}</div>
                        <div>반납: ${item.returnTime || '-'}</div>
                    </div>
                    <div class="flex justify-end gap-2 pt-1">
                        <button onclick="openEditModal('${item.id}')" class="px-3 py-1.5 bg-blue-600/80 hover:bg-blue-600 text-white font-semibold rounded-lg text-xs">수정</button>
                        <button onclick="deleteRental('${item.id}')" class="px-3 py-1.5 bg-rose-600/80 hover:bg-rose-600 text-white font-semibold rounded-lg text-xs">삭제</button>
                    </div>
                </div>
            `).join('');

            tbody.innerHTML = filtered.map(item => `
                <tr class="hover:bg-slate-800/50">
                    <td class="p-3 text-center font-bold text-white">${item.dong}동 ${item.ho}호</td>
                    <td class="p-3">라켓: ${item.racket} / 공: ${item.ball}</td>
                    <td class="p-3 text-slate-400">${item.borrowTime}</td>
                    <td class="p-3 text-slate-400">${item.returnTime || '-'}</td>
                    <td class="p-3 text-center">${badge(item)}</td>
                    <td class="p-3 text-center">
                        <div class="flex items-center justify-center gap-1">
                            <button onclick="openEditModal('${item.id}')" class="px-2 py-1 bg-blue-600/80 hover:bg-blue-600 text-white text-[11px] font-semibold rounded">수정</button>
                            <button onclick="deleteRental('${item.id}')" class="px-2 py-1 bg-rose-600/80 hover:bg-rose-600 text-white text-[11px] font-semibold rounded">삭제</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // CSV 다운로드
        function downloadExcel() {
            if (rentals.length === 0) return showToast('다운로드할 데이터가 없습니다.');
            let csv = "\uFEFF동,호수,라켓,탁구공,대여시각,반납시각,상태\n";
            rentals.forEach(item => {
                csv += `"${item.dong}","${item.ho}","${item.racket}","${item.ball}","${item.borrowTime}","${item.returnTime || '-'}","${item.isReturned ? '반납 완료' : '대여 중'}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `탁구용품_대여내역_${new Date().toISOString().slice(0, 10)}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('📊 CSV 파일이 다운로드되었습니다.');
        }

        // 확인창
        function showCustomConfirm(title, message, onOk) {
            document.getElementById('confirm-modal-title').textContent = title;
            document.getElementById('confirm-modal-message').textContent = message;
            const modal = document.getElementById('confirm-modal');
            const btnOk = document.getElementById('confirm-modal-ok');
            const btnCancel = document.getElementById('confirm-modal-cancel');
            modal.classList.remove('hidden');

            const cleanup = () => {
                modal.classList.add('hidden');
                btnOk.removeEventListener('click', handleOk);
                btnCancel.removeEventListener('click', cleanup);
            };
            const handleOk = () => { cleanup(); onOk(); };
            btnOk.addEventListener('click', handleOk);
            btnCancel.addEventListener('click', cleanup);
        }

        // 알림
        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
            }, 3000);
        }
    </script>
</body>
</html>
