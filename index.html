<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공유형 탁구 용품 대여 대장</title>
    <style>
        * { box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; }
        body { background-color: #f4f6f8; margin: 0; padding: 16px; }
        
        /* 기본 모바일 레이아웃 및 PC 넓은 화면 반응형 트랜지션 */
        .container { 
            max-width: 550px; 
            margin: 0 auto; 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            transition: max-width 0.3s ease;
        }

        /* 관리자 모드 활성화 시 PC 및 큰 화면 대응 모드 */
        .container.admin-mode {
            max-width: 900px;
        }

        h2 { text-align: center; color: #2c3e50; margin-top: 0; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; color: #34495e; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        
        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }

        button.btn-submit { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        button.btn-submit:hover { background-color: #219150; }

        hr { border: 0; height: 1px; background: #e0e0e0; margin: 20px 0; }

        .list-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; color: #2c3e50; }
        .rental-item { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .rental-info { font-size: 14px; line-height: 1.4; }
        .rental-info strong { font-size: 16px; color: #2c3e50; }
        .rental-info .time { font-size: 12px; color: #7f8c8d; }

        .btn-return { background-color: #e74c3c; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-return:hover { background-color: #c0392b; }
        
        .returned { opacity: 0.5; background: #f1f1f1; }
        .badge-returned { background: #95a5a6; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }

        /* 관리자 모드 스타일 */
        .admin-section { margin-top: 25px; padding-top: 15px; border-top: 2px dashed #bdc3c7; }
        .admin-auth-box { display: flex; gap: 8px; margin-bottom: 10px; }
        .admin-auth-box input { flex: 1; padding: 8px; font-size: 14px; }
        .btn-admin { background-color: #34495e; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .btn-admin:hover { background-color: #2c3e50; }
        
        .admin-panel { display: none; margin-top: 15px; background: #edf2f7; padding: 16px; border-radius: 8px; }
        .admin-summary { font-size: 14px; color: #2c3e50; margin-bottom: 12px; font-weight: bold; line-height: 1.5; }
        
        /* 필터 및 검색 컨트롤 레이아웃 */
        .admin-controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; justify-content: space-between; align-items: center; }
        .admin-tabs { display: flex; gap: 6px; flex: 1; min-width: 240px; }
        .admin-tab { flex: 1; padding: 8px 10px; border: 1px solid #cbd5e0; background: white; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; color: #4a5568; }
        .admin-tab.active { background: #3182ce; color: white; border-color: #3182ce; }
        
        .admin-search-box { display: flex; gap: 6px; flex: 1; min-width: 260px; }
        .admin-search-box input { padding: 8px 10px; font-size: 13px; }
        
        .btn-excel { background-color: #27ae60; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .btn-excel:hover { background-color: #219150; }

        .btn-logout { background-color: #e53e3e; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-logout:hover { background-color: #c53030; }

        /* 테이블 스태킹 & 가로 확장 */
        .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; background: white; border-radius: 6px; overflow: hidden; }
        .admin-table th, .admin-table td { border: 1px solid #e2e8f0; padding: 10px 8px; text-align: center; }
        .admin-table th { background-color: #f7fafc; color: #4a5568; font-weight: bold; }
        .status-renting { color: #e67e22; font-weight: bold; }
        .status-done { color: #27ae60; font-weight: bold; }

        .btn-action-edit { background: #3182ce; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; margin-right: 2px; }
        .btn-action-del { background: #e53e3e; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; }
    </style>

    <!-- Firebase SDK 모듈 불러오기 -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy } 
        from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      // ⚠️ 본인의 Firebase 설정 정보로 대체하세요
      const firebaseConfig = {
        apiKey: "FIREBASE_API_KEY_HERE",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "SENDER_ID",
        appId: "APP_ID"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const rentalsRef = collection(db, "tableTennisRentals");

      // 전체 데이터 캐시 및 상태 변수
      let allRentalsData = [];
      let isAdminLoggedIn = false;
      let currentFilter = 'all'; // 'all', 'renting', 'returned'

      // 1. 실시간 대여 등록 함수
      window.addRental = async function() {
        const dong = document.getElementById('dong').value.trim();
        const ho = document.getElementById('ho').value.trim();
        const racket = document.getElementById('racket').value;
        const ball = document.getElementById('ball').value;

        if (!dong || !ho) {
            alert('동과 호수를 입력해주세요.');
            return;
        }

        const now = new Date();
        const timeString = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        try {
            await addDoc(rentalsRef, {
                dong: dong,
                ho: ho,
                racket: racket,
                ball: ball,
                borrowTime: timeString,
                returnTime: null,
                isReturned: false,
                createdAt: Date.now()
            });

            document.getElementById('dong').value = '';
            document.getElementById('ho').value = '';
            alert(`${dong}동 ${ho}호 대여가 등록되었습니다.`);
        } catch (e) {
            alert("등록 실패: " + e.message);
        }
      };

      // 2. 실시간 반납 처리 함수
      window.returnItem = async function(id) {
        const now = new Date();
        const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        try {
            const itemDoc = doc(db, "tableTennisRentals", id);
            await updateDoc(itemDoc, {
                isReturned: true,
                returnTime: timeString
            });
        } catch (e) {
            alert("반납 처리 실패: " + e.message);
        }
      };

      // 3. 관리자 로그인 (비밀번호: 0801)
      window.checkAdmin = function() {
        const pw = document.getElementById('admin-pw').value;
        if (pw === "0801") {
            isAdminLoggedIn = true;
            document.getElementById('admin-auth-box').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            document.getElementById('main-container').classList.add('admin-mode'); // 넓은 화면 적용
            renderAdminTable();
        } else {
            alert('비밀번호가 올바르지 않습니다.');
            document.getElementById('admin-pw').value = '';
        }
      };

      // 4. 관리자 로그아웃
      window.logoutAdmin = function() {
        isAdminLoggedIn = false;
        document.getElementById('admin-panel').style.display = 'none';
        document.getElementById('admin-auth-box').style.display = 'flex';
        document.getElementById('admin-pw').value = '';
        document.getElementById('main-container').classList.remove('admin-mode'); // 기본 화면 크기로 복원
      };

      // 5. 관리자 필터 변경 함수
      window.setAdminFilter = function(filterType) {
        currentFilter = filterType;
        document.querySelectorAll('.admin-tab').forEach(tab => tab.classList.remove('active'));
        document.getElementById(`tab-${filterType}`).classList.add('active');
        renderAdminTable();
      };

      // 6. 관리자 수정 처리 함수
      window.editRentalItem = async function(id) {
        const target = allRentalsData.find(item => item.id === id);
        if (!target) return;

        const newRacket = prompt("라켓 수량을 수정하세요:", target.racket);
        if (newRacket === null) return;

        const newBall = prompt("탁구공 수량을 수정하세요:", target.ball);
        if (newBall === null) return;

        const toggleReturn = confirm(`현재 상태: ${target.isReturned ? '반납 완료' : '대여 중'}\n상태를 변경하시겠습니까?`);
        let isReturned = target.isReturned;
        let returnTime = target.returnTime;

        if (toggleReturn) {
            isReturned = !isReturned;
            if (isReturned && !returnTime) {
                const now = new Date();
                returnTime = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else if (!isReturned) {
                returnTime = null;
            }
        }

        try {
            const itemDoc = doc(db, "tableTennisRentals", id);
            await updateDoc(itemDoc, {
                racket: newRacket,
                ball: newBall,
                isReturned: isReturned,
                returnTime: returnTime
            });
            alert("수정되었습니다.");
        } catch (e) {
            alert("수정 실패: " + e.message);
        }
      };

      // 7. 관리자 삭제 처리 함수
      window.deleteRentalItem = async function(id) {
        if (confirm("정말 이 대여 내역을 삭제하시겠습니까?")) {
            try {
                const itemDoc = doc(db, "tableTennisRentals", id);
                await deleteDoc(itemDoc);
                alert("삭제되었습니다.");
            } catch (e) {
                alert("삭제 실패: " + e.message);
            }
        }
      };

      // 8. 엑셀(CSV) 다운로드 함수
      window.downloadExcel = function() {
        if (allRentalsData.length === 0) {
            alert("다운로드할 데이터가 없습니다.");
            return;
        }

        let csvContent = "\uFEFF동,호수,라켓,탁구공,대여시각,반납시각,상태\n";
        allRentalsData.forEach(item => {
            const status = item.isReturned ? "반납 완료" : "대여 중";
            const retTime = item.returnTime ? item.returnTime : "-";
            csvContent += `"${item.dong}","${item.ho}","${item.racket}","${item.ball}","${item.borrowTime}","${retTime}","${status}"\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        const today = new Date().toISOString().slice(0,10);
        
        link.setAttribute("href", url);
        link.setAttribute("download", `탁구용품_대여내역_${today}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // 9. 관리자 내역 테이블 렌더링
      window.renderAdminTable = function() {
        if (!isAdminLoggedIn) return;

        const tbody = document.getElementById('admin-list-body');
        const summary = document.getElementById('admin-summary');
        const searchKeyword = document.getElementById('admin-search').value.trim();
        tbody.innerHTML = '';

        const totalCount = allRentalsData.length;
        const returnedCount = allRentalsData.filter(item => item.isReturned).length;
        const rentingCount = totalCount - returnedCount;

        summary.innerHTML = `총 누적: ${totalCount}건 | 대여 중: <span style="color:#e67e22;">${rentingCount}건</span> | 반납 완료: <span style="color:#27ae60;">${returnedCount}건</span>`;

        // 탭 필터 적용
        let filtered = allRentalsData.filter(item => {
            if (currentFilter === 'renting') return !item.isReturned;
            if (currentFilter === 'returned') return item.isReturned;
            return true;
        });

        // 검색 필터 적용 (동 또는 호수)
        if (searchKeyword !== '') {
            filtered = filtered.filter(item => 
                item.dong.includes(searchKeyword) || item.ho.includes(searchKeyword)
            );
        }

        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:15px; color:#7f8c8d;">검색/필터 조건에 일치하는 내역이 없습니다.</td></tr>';
            return;
        }

        filtered.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${item.dong}동 ${item.ho}호</strong></td>
                <td>라켓: ${item.racket} / 공: ${item.ball}</td>
                <td>${item.borrowTime}</td>
                <td>${item.returnTime ? item.returnTime : '-'}</td>
                <td class="${item.isReturned ? 'status-done' : 'status-renting'}">
                    ${item.isReturned ? '반납완료' : '대여중'}
                </td>
                <td>
                    <button class="btn-action-edit" onclick="editRentalItem('${item.id}')">수정</button>
                    <button class="btn-action-del" onclick="deleteRentalItem('${item.id}')">삭제</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
      };

      // 10. 데이터 실시간 감지 및 화면 자동 업데이트
      const q = query(rentalsRef, orderBy("createdAt", "desc"));
      onSnapshot(q, (snapshot) => {
        const listContainer = document.getElementById('rental-list');
        listContainer.innerHTML = '';

        allRentalsData = [];

        if (snapshot.empty) {
            listContainer.innerHTML = '<p style="text-align:center; color:#95a5a6; font-size:14px;">현재 대여 내역이 없습니다.</p>';
            if (isAdminLoggedIn) renderAdminTable();
            return;
        }

        snapshot.forEach((docSnapshot) => {
            const item = docSnapshot.data();
            const id = docSnapshot.id;

            allRentalsData.push({ id, ...item });

            const div = document.createElement('div');
            div.className = `rental-item ${item.isReturned ? 'returned' : ''}`;

            let buttonOrStatus = item.isReturned 
                ? `<span class="badge-returned">반납 완료 (${item.returnTime})</span>`
                : `<button class="btn-return" onclick="returnItem('${id}')">반납하기</button>`;

            div.innerHTML = `
                <div class="rental-info">
                    <strong>${item.dong}동 ${item.ho}호</strong><br>
                    라켓: ${item.racket} / 공: ${item.ball}<br>
                    <span class="time">대여: ${item.borrowTime}</span>
                </div>
                <div>${buttonOrStatus}</div>
            `;
            listContainer.appendChild(div);
        });

        if (isAdminLoggedIn) {
            renderAdminTable();
        }
      });
    </script>
</head>
<body>

<div class="container" id="main-container">
    <h2>🏓 탁구 용품 대여 대장 (실시간 공유)</h2>
    
    <div id="rental-form">
        <div class="row">
            <div class="form-group">
                <label for="dong">동</label>
                <input type="text" id="dong" placeholder="예: 101" inputmode="numeric">
            </div>
            <div class="form-group">
                <label for="ho">호수</label>
                <input type="text" id="ho" placeholder="예: 502" inputmode="numeric">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="racket">라켓 수량</label>
                <select id="racket">
                    <option value="2개 (1세트)">2개 (1세트)</option>
                    <option value="4개 (2세트)">4개 (2세트)</option>
                    <option value="1개">1개</option>
                </select>
            </div>
            <div class="form-group">
                <label for="ball">탁구공 수량</label>
                <select id="ball">
                    <option value="2개">2개</option>
                    <option value="1개">1개</option>
                    <option value="3개 이상">3개 이상</option>
                </select>
            </div>
        </div>

        <button class="btn-submit" onclick="addRental()">대여 작성 완료</button>
    </div>

    <hr>

    <div class="list-title">📋 현재 실시간 대여 현황</div>
    <div id="rental-list">데이터 불러오는 중...</div>

    <!-- 관리자 모드 섹션 -->
    <div class="admin-section">
        <div class="list-title">🔒 관리자 모드</div>
        <div class="admin-auth-box" id="admin-auth-box">
            <!-- 비밀번호 암시문구 삭제 완료 -->
            <input type="password" id="admin-pw" placeholder="관리자 비밀번호 입력" maxlength="20">
            <button class="btn-admin" onclick="checkAdmin()">로그인</button>
        </div>

        <div class="admin-panel" id="admin-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <span style="font-weight: bold; color: #2c3e50; font-size: 15px;">📊 전체 대여/반납 데이터 관리판</span>
                <!-- 관리자 전용 로그아웃 버튼 -->
                <button class="btn-logout" onclick="logoutAdmin()">🔒 로그아웃</button>
            </div>
            
            <div class="admin-summary" id="admin-summary"></div>

            <!-- 관리자 컨트롤 (탭 필터, 검색, 엑셀 다운로드) -->
            <div class="admin-controls">
                <div class="admin-tabs">
                    <button class="admin-tab active" id="tab-all" onclick="setAdminFilter('all')">전체보기</button>
                    <button class="admin-tab" id="tab-renting" onclick="setAdminFilter('renting')">대여 중</button>
                    <button class="admin-tab" id="tab-returned" onclick="setAdminFilter('returned')">반납 완료</button>
                </div>
                <div class="admin-search-box">
                    <input type="text" id="admin-search" placeholder="동/호수 검색 (예: 101)" oninput="renderAdminTable()">
                    <button class="btn-excel" onclick="downloadExcel()">📊 엑셀 다운로드</button>
                </div>
            </div>

            <div style="overflow-x: auto;">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>호실</th>
                            <th>대여 품목</th>
                            <th>대여시각</th>
                            <th>반납시각</th>
                            <th>상태</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="admin-list-body">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
